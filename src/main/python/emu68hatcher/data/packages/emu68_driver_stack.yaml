name: emu68_driver_stack
friendly_name: Emu68 Driver Stack
group: System
description: 'consolidated Pi4/CM4 driver stack - genet ethernet (SANA-II), xhci usb, nvme storage + gic400/bcmpcie libraries'
versions:
- '3.1'
- '3.2'
- 3.2.2.1
- 3.2.3
- '3.9'
emu68_versions:
- 1.1.0-alpha.1
mandatory: true
download:
  source: github
  repo: rondoval/emu68-driver-stack
  tag: v2.0.0
  filename: emu68-drivers-2.0.0.lha
  hash: A1298F0178AF7807F8CEE0231733BEA8
# selectable Amiga stacks need the SANA-II genet and Poseidon 4.x xhci variants in Storage/
install:
- from: LIBS/gic400.library
  to: Libs/
- from: LIBS/bcmpcie.library
  to: Libs/
- from: LIBS/openpci.library
  to: Libs/
- from: Storage/DEVS/Networks/genet.device
  to: Devs/Networks/
- from: Storage/DEVS/USBHardware/xhci.device
  to: Devs/USBHardware/
- from: DEVS/nvme.device
  to: Devs/
- from: Storage/C/genet-stats
  to: C/
- from: C/lspci
  to: C/
- from: C/nvmeinfo
  to: C/
- from: C/nvmeadm
  to: C/
- from: C/emu68check
  to: C/
