hatcher_light:
  display_name: Hatcher Light
  required_packages:
    - fonts_apparent
    - fonts_magicwb
  components:
    palette:
      - source: System/Prefs/Presets/hatcher_palette.prefs
        targets:
          - Prefs/Env-Archive/Sys/Palette.prefs
          - Prefs/Presets/hatcher_palette.prefs
    fonts:
      - source: System/Prefs/Presets/hatcher_fonts.prefs
        targets:
          - Prefs/Env-Archive/Sys/font.prefs
          - Prefs/Presets/hatcher_fonts.prefs
    mui: []
    wallpaper: []

hatcher_dark:
  display_name: Hatcher Dark
  required_packages:
    - fonts_apparent
    - fonts_magicwb
  components:
    palette:
      - source: System/Prefs/Presets/hatcher_palette_dark.prefs
        targets:
          - Prefs/Env-Archive/Sys/Palette.prefs
          - Prefs/Presets/hatcher_palette_dark.prefs
    fonts:
      - source: System/Prefs/Presets/hatcher_fonts.prefs
        targets:
          - Prefs/Env-Archive/Sys/font.prefs
          - Prefs/Presets/hatcher_fonts.prefs
    mui: []
    wallpaper: []
